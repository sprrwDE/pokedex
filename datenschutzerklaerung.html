<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datenschutzerklärung</title>
    <link rel="stylesheet" href="/legal.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/colors.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  </head>
  <body>
    <header>
      <div class="container header-content">
        <h1>Gotta fetch 'em ALL</h1>
        <div class="button-wrapper">
          <h3>sort by:</h3>
          <div class="button-wrapper-inner">
            <button class="btn btn-dark" onclick="reset()">number</button>
            <button class="btn btn-dark" onclick="sortName()">name</button>
            <button class="btn btn-dark" onclick="sortType()">type</button>
          </div>
        </div>
        <div class="button-wrapper">
          <h3>filter:</h3>
          <input
            type="text"
            id="filter"
            placeholder="search"
            oninput="filter()"
          />
          <div class="button-wrapper-inner">
            <button class="btn btn-dark" onclick="reset()">reset</button>
          </div>
        </div>
      </div>
    </header>
    <main></main>
    <footer>
      <div class="button-wrapper">
        <button class="btn btn-dark" onclick="loadPokemon()">load more</button>
      </div>
    </footer>
  </body>
</html>
